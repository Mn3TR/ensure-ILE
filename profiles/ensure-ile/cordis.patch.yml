# ensure-ILE profile patch - the learning build's own configuration layer.
#
# It is applied after every bundle layer. Keep it small: everything a learner
# needs should be visible here, and anything this file does not mention falls
# back to the upstream default.

- id: desktop-shell
  name: dsh-plugin-desktop
  config:
    mode: advanced
    windowsMaterial: off
    openBrowser: false
    networkExposure: loopback

# Desktop notifications stay off until a learner turns them on in 设置。
- id: desktop-notifications
  name: dsh-plugin-desktop/notifications
  config:
    enabled: false
    notifyOnTurnCompletion: false
    notifyOnTurnFailure: false
    notifyOnJobCompletion: false
    notifyOnJobFailure: false
    notifyOnScheduleCompletion: false
    notifyOnScheduleFailure: false

# New sessions start in the 做题 preset (its first mode is 引导模式) instead of
# the standard one, so a learner never has to pick a mode before asking a
# question. The 开学 preset is registered only while onboarding is unfinished,
# and 聊天 is the other pick.
- id: agent-preset-registry
  config:
    default: work

# ensure-ILE owns every file it writes, the session working directory included.
# The Web bundle creates the first-use Workspace under the OS Documents folder;
# pointing that lookup at the data root instead keeps the workspace (and the
# memory project layer that hangs off it) inside .ensure-ile.
- id: workspace-controller
  config:
    documentsDirectory: !!js dshHomePath('..')


# The interface layer itself is dsh-claude-style; this row retunes it rather than
# replacing it. Our brand name stands where "Claude" did, the accent is the
# learning build's blue-green instead of the theme's clay, the home screen is the
# plain greeting-and-composer layout (the studio one opens on a usage dashboard a
# student has no use for), and the composer mascot is off: a student's screen
# should not carry a joke they did not choose.
- id: ui-skin-claude-style
  name: dsh-claude-style
  config:
    sodium: on
    brandName: en∫ure
    brandInk: accent
    brandAccent: '#4E9C90'
    paletteColors: custom
    customAccent: '#4E9C90'
    homeLayout: classic
    mascot: off
    permissionsControl: false
# A learner never switches permission modes, so the composer's chip row is gone
# rather than retuned, and with it the two sidebar entries that lead to surfaces
# this build does not ship (插件 / 自动化任务). `permissionsControl: false` drops
# dsh-claude-style's own chips; disabling the upstream row drops the one it would
# otherwise fall back to. The mode itself stays whatever the host resolves.
- id: ui-plugin-manager
  disabled: true

- id: ui-schedule
  disabled: true

- id: ui-permission
  disabled: true
