# ensure-ILE profile patch - the learning build's own configuration layer.
#
# It is applied after every bundle layer. Keep it small: everything a learner
# needs should be visible here, and anything this file does not mention falls
# back to the upstream default.

- id: desktop-shell
  name: dsh-plugin-desktop
  config:
    mode: advanced
    windowsMaterial: off
    openBrowser: false
    networkExposure: loopback

# Desktop notifications stay off until a learner turns them on in 设置。
- id: desktop-notifications
  name: dsh-plugin-desktop/notifications
  config:
    enabled: false
    notifyOnTurnCompletion: false
    notifyOnTurnFailure: false
    notifyOnJobCompletion: false
    notifyOnJobFailure: false
    notifyOnScheduleCompletion: false
    notifyOnScheduleFailure: false

# New sessions start in the 做题 preset (its first mode is 引导模式) instead of
# the standard one, so a learner never has to pick a mode before asking a
# question. The 开学 preset is registered only while onboarding is unfinished,
# and 聊天 is the other pick.
- id: agent-preset-registry
  config:
    default: work

# ensure-ILE owns every file it writes, the session working directory included.
# The Web bundle creates the first-use Workspace under the OS Documents folder;
# pointing that lookup at the data root instead keeps the workspace (and the
# memory project layer that hangs off it) inside .ensure-ile.
- id: workspace-controller
  config:
    documentsDirectory: !!js dshHomePath('..')

