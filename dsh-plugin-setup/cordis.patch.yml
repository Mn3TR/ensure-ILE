# ensure-ILE setup bundle patch: the 开学 preset registers itself.
# The preset row lives in dsh-plugin-setup/presets, which registers only while
# <DSH_HOME>/setup.json says onboarding is unfinished — the registry has no
# hidden flag, so "do not register" is how 开学 leaves the picker.
- insert:
    - id: setup-presets
      name: dsh-plugin-setup/presets
