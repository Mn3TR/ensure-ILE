# Desktop Host operations compose around the existing Web bundle. Compatibility
# mode keeps upstream ownership of the browser carrier and rendered UI.
- id: ui-sidebar-browser
  # Desktop capability does not depend on the user's Profile name. The later
  # user patch can still disable the Browser explicitly.
  disabled: false

# DHDL: this build is a learning environment, so the new-session picker only
# offers the standard preset and the guide preset. The upstream PTC, minimal
# and creator presets stay untouched in the pinned submodule; disabling them
# here keeps the picker focused without editing upstream files.
- id: preset-ptc
  disabled: true
- id: preset-minimal
  disabled: true
- id: preset-cordis
  disabled: true

- insert:
    - id: desktop-shell
      name: dsh-plugin-desktop
      config:
        mode: compatibility
    - id: desktop-terminal
      name: dsh-plugin-desktop/terminal
      disabled: !!js process.platform === 'linux'
    - id: desktop-diagnostics
      name: dsh-plugin-desktop/diagnostics
    - id: desktop-notifications
      name: dsh-plugin-desktop/notifications
    - id: desktop-pnpm
      name: dsh-plugin-desktop/pnpm
    - id: desktop-profiles
      name: dsh-plugin-desktop/profiles
    - id: desktop-updates
      name: dsh-plugin-desktop/updates
    # DHDL: a selectable agent preset that replaces the system prompt with the
    # guide document. Rows mounted inside a preset run in the agent scope, which
    # is the only scope where a persona may shadow the deployment persona.
    - id: guide-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: guide
        name: 引导模式
        description: 引导学生用自己的思路把题解出来，不给答案
        order: 40
        plugins:
          - name: dsh-plugin-guide

# A desktop launch has no terminal operator waiting for the Web readiness line.
- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
    trustedHosts: []
