# ensure-ILE guide bundle patch: one insert over the profile root.
# The preset definition lives with the plugin that implements it, so the desktop
# shell no longer knows that guide mode exists.
- insert:
    - id: guide-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: guide
        name: 引导模式
        description: 引导学生用自己的思路把题解出来，不给答案
        order: 40
        plugins:
          - name: dsh-plugin-guide
